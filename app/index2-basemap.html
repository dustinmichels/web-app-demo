<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MA Towns Map</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      #map {
        width: 100%;
        height: 100%;
      }
      #townSelect {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 1;
        background: white;
        padding: 5px;
      }
    </style>
    <link
      href="https://unpkg.com/maplibre-gl@5.18.0/dist/maplibre-gl.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <select id="townSelect">
      <option value="">Select a town</option>
    </select>
    <div id="map"></div>

    <script src="https://unpkg.com/maplibre-gl@5.18.0/dist/maplibre-gl.js"></script>
    <script>
      const map = new maplibregl.Map({
        container: "map",
        style: {
          version: 8,
          sources: {
            osm: {
              type: "raster",
              tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
              tileSize: 256,
              attribution:
                '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            },
          },
          layers: [
            {
              id: "osm",
              type: "raster",
              source: "osm",
            },
          ],
        },
        center: [-71.5, 42.3],
        zoom: 8,
      });

      let selectedTownId = null;

      fetch("data/towns.geojson")
        .then((response) => response.json())
        .then((data) => {
          // Add towns source
          map.addSource("towns", {
            type: "geojson",
            data: data,
          });

          // Add fill layer (mostly transparent)
          map.addLayer({
            id: "towns-fill",
            type: "fill",
            source: "towns",
            paint: {
              "fill-color": "#0080ff",
              "fill-opacity": 0.3,
            },
          });

          // Add outline layer
          map.addLayer({
            id: "towns-outline",
            type: "line",
            source: "towns",
            paint: {
              "line-color": "#000",
              "line-width": 1,
            },
          });

          // Highlight layer
          map.addLayer({
            id: "towns-highlight",
            type: "line",
            source: "towns",
            paint: {
              "line-color": "red",
              "line-width": 3,
            },
            filter: ["==", "TOWN_ID", -1],
          });

          // Populate dropdown
          const select = document.getElementById("townSelect");
          data.features.forEach((f) => {
            const option = document.createElement("option");
            option.value = f.properties.TOWN_ID;
            option.textContent = f.properties.TOWN;
            select.appendChild(option);
          });

          // Dropdown change
          select.addEventListener("change", (e) => {
            const id = parseInt(e.target.value);
            highlightTown(id);
          });

          // Map click
          map.on("click", "towns-fill", (e) => {
            if (!e.features || !e.features.length) return;
            const id = e.features[0].properties.TOWN_ID;
            document.getElementById("townSelect").value = id;
            highlightTown(id);
          });

          function highlightTown(id) {
            selectedTownId = id;
            if (id === undefined || id === null || isNaN(id)) {
              map.setFilter("towns-highlight", ["==", "TOWN_ID", -1]);
            } else {
              map.setFilter("towns-highlight", ["==", "TOWN_ID", id]);
            }
          }
        });

      // Cursor pointer
      map.on("mouseenter", "towns-fill", () => {
        map.getCanvas().style.cursor = "pointer";
      });
      map.on("mouseleave", "towns-fill", () => {
        map.getCanvas().style.cursor = "";
      });
    </script>
  </body>
</html>
