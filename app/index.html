<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MA Towns Map</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      #map {
        width: 100%;
        height: 100%;
      }
    </style>
    <link
      href="https://unpkg.com/maplibre-gl@5.18.0/dist/maplibre-gl.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="map"></div>

    <script src="https://unpkg.com/maplibre-gl@5.18.0/dist/maplibre-gl.js"></script>
    <script>
      // Initialize the map without a basemap
      const map = new maplibregl.Map({
        container: "map",
        style: {
          version: 8,
          sources: {},
          layers: [],
        },
        center: [-71.5, 42.2], // roughly central MA
        zoom: 7,
      });

      map.on("load", () => {
        // Load towns GeoJSON
        map.addSource("towns", {
          type: "geojson",
          data: "data/towns.geojson",
        });

        // Add polygon layer
        map.addLayer({
          id: "town-polygons",
          type: "fill",
          source: "towns",
          paint: {
            "fill-color": "#007cbf",
            "fill-opacity": 0.5,
          },
        });

        // Add polygon outlines
        map.addLayer({
          id: "town-borders",
          type: "line",
          source: "towns",
          paint: {
            "line-color": "#003366",
            "line-width": 2,
          },
        });
      });
    </script>
  </body>
</html>
