<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MA Towns Map</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      #map {
        width: 100%;
        height: 100%;
      }
    </style>
    <link
      href="https://unpkg.com/maplibre-gl@5.18.0/dist/maplibre-gl.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="map"></div>

    <script src="https://unpkg.com/maplibre-gl@5.18.0/dist/maplibre-gl.js"></script>
    <script>
      // Initialize map with no basemap
      const map = new maplibregl.Map({
        container: "map",
        style: {
          version: 8,
          sources: {},
          layers: [],
        },
        center: [-71.5, 42.3], // roughly central MA
        zoom: 8,
      });

      // Load towns GeoJSON
      fetch("data/towns.geojson")
        .then((response) => response.json())
        .then((data) => {
          // Add GeoJSON source
          map.addSource("towns", {
            type: "geojson",
            data: data,
          });

          // Add polygon layer
          map.addLayer({
            id: "towns-fill",
            type: "fill",
            source: "towns",
            paint: {
              "fill-color": "#0080ff",
              "fill-opacity": 0.5,
            },
          });

          // Add polygon outline
          map.addLayer({
            id: "towns-outline",
            type: "line",
            source: "towns",
            paint: {
              "line-color": "#000",
              "line-width": 1,
            },
          });
        });
    </script>
  </body>
</html>
