<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MA Towns Map</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      #map {
        width: 100%;
        height: 100%;
      }
      #townSelect {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 2;
        background: white;
        padding: 5px;
      }
      #toggleContainer {
        position: absolute;
        top: 50px;
        left: 10px;
        z-index: 2;
        background: white;
        padding: 5px;
      }
      .legend {
        position: absolute;
        bottom: 30px;
        left: 10px;
        z-index: 2;
        background: white;
        padding: 5px;
        font-family: sans-serif;
        font-size: 12px;
      }
      .legend div {
        display: flex;
        align-items: center;
        margin-bottom: 2px;
      }
      .legend span {
        width: 12px;
        height: 12px;
        display: inline-block;
        margin-right: 5px;
      }
    </style>
    <link
      href="https://unpkg.com/maplibre-gl@5.18.0/dist/maplibre-gl.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <select id="townSelect">
      <option value="">Select a town</option>
    </select>
    <div id="toggleContainer">
      <label>
        <input type="radio" name="availability" value="bikes" checked />
        Bikes available
      </label>
      <br />
      <label>
        <input type="radio" name="availability" value="docks" />
        Docks available
      </label>
    </div>
    <div class="legend" id="legend">
      <div><span style="background: red"></span> 0</div>
      <div><span style="background: yellow"></span> 1</div>
      <div><span style="background: green"></span> >1</div>
    </div>
    <div id="map"></div>

    <script src="https://unpkg.com/maplibre-gl@5.18.0/dist/maplibre-gl.js"></script>
    <script>
      const map = new maplibregl.Map({
        container: "map",
        style: {
          version: 8,
          sources: {
            osm: {
              type: "raster",
              tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
              tileSize: 256,
              attribution:
                '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            },
          },
          layers: [
            {
              id: "osm",
              type: "raster",
              source: "osm",
            },
          ],
        },
        center: [-71.5, 42.3],
        zoom: 8,
      });

      let selectedTownId = null;
      let stationsData = null;

      fetch("data/towns.geojson")
        .then((res) => res.json())
        .then((data) => {
          map.addSource("towns", { type: "geojson", data });
          map.addLayer({
            id: "towns-fill",
            type: "fill",
            source: "towns",
            paint: { "fill-color": "#0080ff", "fill-opacity": 0.3 },
          });
          map.addLayer({
            id: "towns-outline",
            type: "line",
            source: "towns",
            paint: { "line-color": "#000", "line-width": 1 },
          });
          map.addLayer({
            id: "towns-highlight",
            type: "line",
            source: "towns",
            paint: { "line-color": "red", "line-width": 3 },
            filter: ["==", "TOWN_ID", -1],
          });

          const select = document.getElementById("townSelect");
          data.features.forEach((f) => {
            const option = document.createElement("option");
            option.value = f.properties.TOWN_ID;
            option.textContent = f.properties.TOWN;
            select.appendChild(option);
          });
          select.addEventListener("change", (e) => {
            const id = parseInt(e.target.value);
            highlightTown(id);
          });
          map.on("click", "towns-fill", (e) => {
            if (!e.features || !e.features.length) return;
            const id = e.features[0].properties.TOWN_ID;
            document.getElementById("townSelect").value = id;
            highlightTown(id);
          });
          function highlightTown(id) {
            selectedTownId = id;
            if (id === undefined || id === null || isNaN(id)) {
              map.setFilter("towns-highlight", ["==", "TOWN_ID", -1]);
            } else {
              map.setFilter("towns-highlight", ["==", "TOWN_ID", id]);
            }
          }
        });

      map.on("mouseenter", "towns-fill", () => {
        map.getCanvas().style.cursor = "pointer";
      });
      map.on("mouseleave", "towns-fill", () => {
        map.getCanvas().style.cursor = "";
      });

      // --- Stations ---
      fetch("data/stations.geojson")
        .then((res) => res.json())
        .then((data) => {
          stationsData = data;

          map.addSource("stations", { type: "geojson", data: stationsData });
          map.addLayer({
            id: "stations-circle",
            type: "circle",
            source: "stations",
            paint: {
              "circle-radius": 6,
              "circle-color": [
                "case",
                ["==", ["get", "bikesAvailable"], 0],
                "red",
                ["==", ["get", "bikesAvailable"], 1],
                "yellow",
                "green",
              ],
              "circle-stroke-color": "#000",
              "circle-stroke-width": 1,
            },
          });

          map.on("click", "stations-circle", (e) => {
            const f = e.features[0];
            const props = f.properties;
            const popup = new maplibregl.Popup()
              .setLngLat(f.geometry.coordinates)
              .setHTML(
                `<strong>${props.stationName}</strong><br>
                 Bikes: ${props.bikesAvailable}<br>
                 E-bikes: ${props.ebikesAvailable}<br>
                 Docks: ${props.bikeDocksAvailable}`,
              )
              .addTo(map);
          });

          map.on("mouseenter", "stations-circle", () => {
            map.getCanvas().style.cursor = "pointer";
          });
          map.on("mouseleave", "stations-circle", () => {
            map.getCanvas().style.cursor = "";
          });
        });

      // --- Toggle ---
      const radios = document.querySelectorAll('input[name="availability"]');
      radios.forEach((r) =>
        r.addEventListener("change", () => updateStationsColor()),
      );

      function updateStationsColor() {
        if (!stationsData) return;
        const mode = document.querySelector(
          'input[name="availability"]:checked',
        ).value;

        const paint = {
          "circle-radius": 6,
          "circle-stroke-color": "#000",
          "circle-stroke-width": 1,
        };

        if (mode === "bikes") {
          paint["circle-color"] = [
            "case",
            ["==", ["get", "bikesAvailable"], 0],
            "red",
            ["==", ["get", "bikesAvailable"], 1],
            "yellow",
            "green",
          ];
        } else {
          paint["circle-color"] = [
            "case",
            ["==", ["get", "bikeDocksAvailable"], 0],
            "red",
            ["==", ["get", "bikeDocksAvailable"], 1],
            "yellow",
            "green",
          ];
        }

        map.setPaintProperty(
          "stations-circle",
          "circle-color",
          paint["circle-color"],
        );
      }
    </script>
  </body>
</html>
