<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MA Towns Map</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      #map {
        width: 100%;
        height: 100%;
      }
      #townSelect,
      #toggleContainer,
      #stats,
      .legend {
        position: absolute;
        z-index: 2;
        background: white;
        padding: 5px;
        font-family: sans-serif;
      }
      #townSelect {
        top: 10px;
        left: 10px;
      }
      #toggleContainer {
        top: 50px;
        left: 10px;
      }
      #stats {
        top: 150px;
        left: 10px;
        font-size: 14px;
      }
      .legend {
        bottom: 30px;
        left: 10px;
        font-size: 12px;
      }
      .legend div {
        display: flex;
        align-items: center;
        margin-bottom: 2px;
      }
      .legend span {
        width: 12px;
        height: 12px;
        display: inline-block;
        margin-right: 5px;
      }
    </style>
    <link
      href="https://unpkg.com/maplibre-gl@5.18.0/dist/maplibre-gl.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <select id="townSelect">
      <option value="">Select a town</option>
    </select>
    <div id="toggleContainer">
      <label
        ><input type="radio" name="availability" value="bikes" checked /> Bikes
        available</label
      ><br />
      <label
        ><input type="radio" name="availability" value="docks" /> Docks
        available</label
      >
    </div>
    <div class="legend" id="legend">
      <div><span style="background: red"></span> 0</div>
      <div><span style="background: yellow"></span> 1</div>
      <div><span style="background: green"></span> >1</div>
    </div>
    <div id="stats">
      <strong>Stations Stats:</strong><br />
      Number of stations: 0<br />
      Bikes available: 0<br />
      E-bikes available: 0<br />
      Docks available: 0
    </div>
    <div id="map"></div>

    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
    <script src="https://unpkg.com/maplibre-gl@5.18.0/dist/maplibre-gl.js"></script>
    <script>
      const map = new maplibregl.Map({
        container: "map",
        style: {
          version: 8,
          sources: {
            osm: {
              type: "raster",
              tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
              tileSize: 256,
              attribution:
                '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            },
          },
          layers: [{ id: "osm", type: "raster", source: "osm" }],
        },
        center: [-71.5, 42.3],
        zoom: 8,
      });

      let selectedTownId = null;
      let stationsData = null;
      let townsData = null;
      const statsDiv = document.getElementById("stats");
      const townSelect = document.getElementById("townSelect");

      // --- Load Stations ---
      fetch("data/stations.geojson")
        .then((res) => res.json())
        .then((data) => {
          stationsData = data;
          map.addSource("stations", { type: "geojson", data: stationsData });
          map.addLayer({
            id: "stations-circle",
            type: "circle",
            source: "stations",
            paint: {
              "circle-radius": 6,
              "circle-color": [
                "case",
                ["==", ["get", "bikesAvailable"], 0],
                "red",
                ["==", ["get", "bikesAvailable"], 1],
                "yellow",
                "green",
              ],
              "circle-stroke-color": "#000",
              "circle-stroke-width": 1,
            },
          });
          map.on("click", "stations-circle", (e) => {
            const f = e.features[0],
              p = f.properties;
            new maplibregl.Popup()
              .setLngLat(f.geometry.coordinates)
              .setHTML(
                `<strong>${p.stationName}</strong><br>Bikes: ${p.bikesAvailable}<br>E-bikes: ${p.ebikesAvailable}<br>Docks: ${p.bikeDocksAvailable}`,
              )
              .addTo(map);
          });
          map.on(
            "mouseenter",
            "stations-circle",
            () => (map.getCanvas().style.cursor = "pointer"),
          );
          map.on(
            "mouseleave",
            "stations-circle",
            () => (map.getCanvas().style.cursor = ""),
          );

          updateStationsColor();
        });

      // --- Load Towns ---
      fetch("data/towns.geojson")
        .then((res) => res.json())
        .then((data) => {
          townsData = data;

          // Filter towns to only those with at least one station
          const townsWithStations = data.features.filter((town) =>
            stationsData.features.some((st) =>
              turf.booleanPointInPolygon(st.geometry, town.geometry),
            ),
          );

          // Update dropdown with filtered towns
          townsWithStations.forEach((f) => {
            const option = document.createElement("option");
            option.value = f.properties.TOWN_ID;
            option.textContent = f.properties.TOWN;
            townSelect.appendChild(option);
          });

          // Add filtered towns as a map source
          map.addSource("towns", {
            type: "geojson",
            data: { type: "FeatureCollection", features: townsWithStations },
          });
          map.addLayer({
            id: "towns-fill",
            type: "fill",
            source: "towns",
            paint: { "fill-color": "#0080ff", "fill-opacity": 0.3 },
          });
          map.addLayer({
            id: "towns-outline",
            type: "line",
            source: "towns",
            paint: { "line-color": "#000", "line-width": 1 },
          });
          map.addLayer({
            id: "towns-highlight",
            type: "line",
            source: "towns",
            paint: { "line-color": "red", "line-width": 3 },
            filter: ["==", "TOWN_ID", -1],
          });

          // Event listeners
          townSelect.addEventListener("change", (e) => {
            highlightTown(parseInt(e.target.value));
            updateStats();
          });
          map.on("click", "towns-fill", (e) => {
            const id = e.features[0].properties.TOWN_ID;
            townSelect.value = id;
            highlightTown(id);
            updateStats();
          });
          map.on(
            "mouseenter",
            "towns-fill",
            () => (map.getCanvas().style.cursor = "pointer"),
          );
          map.on(
            "mouseleave",
            "towns-fill",
            () => (map.getCanvas().style.cursor = ""),
          );
        });

      function highlightTown(id) {
        selectedTownId = id;
        map.setFilter(
          "towns-highlight",
          id ? ["==", "TOWN_ID", id] : ["==", "TOWN_ID", -1],
        );
      }

      // --- Toggle Bikes/Docks ---
      document
        .querySelectorAll('input[name="availability"]')
        .forEach((r) => r.addEventListener("change", updateStationsColor));

      function updateStationsColor() {
        if (!stationsData) return;
        const mode = document.querySelector(
          'input[name="availability"]:checked',
        ).value;
        map.setPaintProperty(
          "stations-circle",
          "circle-color",
          mode === "bikes"
            ? [
                "case",
                ["==", ["get", "bikesAvailable"], 0],
                "red",
                ["==", ["get", "bikesAvailable"], 1],
                "yellow",
                "green",
              ]
            : [
                "case",
                ["==", ["get", "bikeDocksAvailable"], 0],
                "red",
                ["==", ["get", "bikeDocksAvailable"], 1],
                "yellow",
                "green",
              ],
        );
      }

      // --- Stats calculation ---
      function updateStats() {
        if (!stationsData) return;
        let filtered = stationsData.features;
        if (selectedTownId && townsData) {
          const townFeature = townsData.features.find(
            (f) => f.properties.TOWN_ID === selectedTownId,
          );
          if (townFeature)
            filtered = stationsData.features.filter((s) =>
              turf.booleanPointInPolygon(s.geometry, townFeature.geometry),
            );
        }
        const num = filtered.length;
        const bikes = filtered.reduce(
          (sum, s) => sum + Number(s.properties.bikesAvailable),
          0,
        );
        const ebikes = filtered.reduce(
          (sum, s) => sum + Number(s.properties.ebikesAvailable),
          0,
        );
        const docks = filtered.reduce(
          (sum, s) => sum + Number(s.properties.bikeDocksAvailable),
          0,
        );
        statsDiv.innerHTML = `<strong>Stations Stats:</strong><br>
          Number of stations: ${num}<br>
          Bikes available: ${bikes}<br>
          E-bikes available: ${ebikes}<br>
          Docks available: ${docks}`;
      }
    </script>
  </body>
</html>
